name: CI — QuickPanel360

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── API ─────────────────────────────────────────────────────
  api:
    name: API (lint · typecheck · prisma · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci --passWithNoTests

  # ── Web ─────────────────────────────────────────────────────
  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_NAME: QuickPanel360
          NEXT_PUBLIC_APP_VERSION: ${{ github.ref_name || '0.1.0' }}
          NEXT_PUBLIC_APP_ENV: ci
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: npm run build

  # ── Version sync ────────────────────────────────────────────
  version-sync:
    name: Version sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version consistency across packages
        run: |
          ROOT=$(node -p "require('./package.json').version")
          API=$(node -p "require('./apps/api/package.json').version")
          WEB=$(node -p "require('./apps/web/package.json').version")
          echo "Root: $ROOT | API: $API | Web: $WEB"
          if [ "$ROOT" != "$API" ] || [ "$ROOT" != "$WEB" ]; then
            echo "❌ Versions are out of sync!"
            echo "   Run: node scripts/release/bump-version.js <version>"
            exit 1
          fi
          echo "✅ Versions in sync: $ROOT"
